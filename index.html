<div class="g g3" style="margin-top:16px">${[['Churches & religious centers',c+' church temple mosque '+loc()],['Cultural organizations & community centers',c+' cultural community center '+loc()],['Grocery stores & markets',c+' grocery market '+loc()],['Restaurants',c+' restaurant '+loc()]].map(([h,q])=>`<div class="card"><h3>${h}</h3><p>${e(c)}, near ${e(loc())}.</p>${ext(map(q),'Search maps','o')}</div>`).join('')}<div class="card"><h3>Festivals & events</h3><p>Check each organizer's site before attending.</p>${ext('https://www.google.com/search?q='+encodeURIComponent(c+' cultural festival events '+loc()),'Search events','o')}</div></div>
`}
/* Community Circle: separate discussion page. Demo posts only;
   production posting requires accounts, storage, and active moderation. */
function circle(){return `<div class="eb">Community Circle</div><h1>A place to ask, share, and connect.</h1><p class="lead">Find conversations about everyday life, language learning, housing, and new beginnings. This is a demonstration space; real community posts and moderation are not connected.</p>
<h2>${e(t('fh'))} <span class="tag gr">Prototype</span></h2><section class="card"><div class="warn" style="margin-bottom:14px"><b>Guidelines:</b> Be kind. Never post names of others, addresses, ID or case numbers, or legal documents. Do not share immigration case details. Posts here exist only in this browser tab and are not stored on a server. Reporting is a demo; a real launch needs moderators.</div>
<div class="row"><div style="flex:2"><label for="fq">${e(t('find'))}</label><input class="inp" id="fq" data-a="q" value="${e(S.q)}"></div><div><label for="fl">Language</label><select class="inp" id="fl" data-a="fl">${['All',...LANGS].map(x=>`<option ${x===S.fl?'selected':''}>${x}</option>`).join('')}</select></div><div><label for="ft">Topic</label><select class="inp" id="ft" data-a="ft">${['All',...TOPICS].map(x=>`<option ${x===S.ft?'selected':''}>${x}</option>`).join('')}</select></div><button class="btn" data-a="compose">${e(t('newp'))}</button></div>
${S.compose?(S.name?`<form data-f="post" style="margin-top:14px"><label for="ph">Title</label><input class="inp" id="ph" name="h" maxlength="110" required><label for="pb" style="margin-top:10px">Post</label><textarea class="inp" id="pb" name="b" maxlength="800" rows="4" required></textarea><div class="row" style="margin-top:10px"><div><label for="pl">Language</label><select class="inp" id="pl" name="l">${LANGS.map(x=>`<option ${x===S.pref?'selected':''}>${x}</option>`).join('')}</select></div><div><label for="pt">Topic</label><select class="inp" id="pt" name="t">${TOPICS.map(x=>`<option>${x}</option>`).join('')}</select></div><button class="btn">Post (demo)</button></div>${S.err?`<div class="warn" role="alert" style="margin-top:10px">${e(S.err)}</div>`:''}</form>`:`<div class="warn" style="margin-top:14px">Create a demo profile to post. <button class="btn s" data-a="nav" data-v="acc">Go to profile →</button></div>`):''}
<div id="fl-list" style="margin-top:8px">${fitems()}</div></section>`}
function acc(){const sv=RES.filter(r=>S.saved[r.id]);return `<div class="eb">Your space</div><h1>${S.name?e(t('hello'))+', '+e(S.name):e(t('acc'))}</h1><p class="lead"><b>Demo profile only</b> — not a secure account. No password or server; nothing here is stored permanently. You only need a demo profile to post in Community Circle.</p>
<div class="g g2"><section class="card"><form data-f="acct"><label for="nm">Display name (a nickname is fine)</label><input class="inp" id="nm" name="name" minlength="2" maxlength="30" required value="${e(S.name)}" autocomplete="off"><label for="pf" style="margin-top:10px">Preferred language</label><select class="inp" id="pf" name="pref">${LANGS.map(x=>`<option ${x===S.pref?'selected':''}>${x}</option>`).join('')}</select><label for="pc" style="margin-top:10px">County (general location)</label><input class="inp" id="pc" name="county" maxlength="80" value="${e(S.county)}"><label for="pv" style="margin-top:10px">English level</label><select class="inp" id="pv" name="lv">${LV.map(x=>`<option ${x===S.lv?'selected':''}>${x}</option>`).join('')}</select><div style="margin-top:14px"><button class="btn">${S.name?'Save profile':'Continue with demo profile'}</button> ${S.name?'<button type="button" class="btn o" data-a="out">Sign out</button>':''}</div></form></section>
<section class="card"><h3>Privacy first</h3><div class="ok">Imminent never asks for immigration status, passport or A-numbers, or legal documents. Only a display name, language, level and broad location are used.</div><h3 style="margin-top:16px">Saved resources (${sv.length})</h3>${sv.length?sv.map(r=>`<p style="margin:6px 0">${ext(r.u,r.t,'o s')}</p>`).join(''):'<p class="sm">Nothing saved yet. Use ☆ Save on resource cards.</p>'}<h3>Learning progress</h3><p>${Object.keys(S.ld).length} lessons completed</p></section></div>`}
/* Builds the shared header and the active top-level page.
   Keep the six entries in N in sync with the translated navigation labels. */
function render(){const V={home,imm,lang,com,circle,acc},N=[['home','⌂'],['imm','▤'],['lang','◉'],['com','♧'],['circle','◎'],['acc','♙']];
document.documentElement.lang=S.lang;document.body.style.fontSize=S.big?'18px':'';
$('#app').innerHTML=`<a class="skip" href="#main">Skip to content</a><div class="app"><header class="side"><div class="brand"><span class="mark" aria-hidden="true">✳</span>imminent</div><nav class="nav" aria-label="Main">${N.map(([k,i])=>`<button data-a="nav" data-v="${k}" class="${S.page===k?'on':''}" ${S.page===k?'aria-current="page"':''}><span aria-hidden="true">${i}</span><span>${e(t(k))}</span></button>`).join('')}</nav></header>
<main class="main" id="main" tabindex="-1"><div class="top"><span class="pill">Interactive prototype</span><button class="pill" data-a="big" aria-pressed="${!!S.big}">A+ Larger text</button><label class="sm" style="margin:0">🌐 <select data-a="L" aria-label="Language">${Object.keys(T).map(k=>`<option value="${k}" ${k===S.lang?'selected':''}>${T[k].n}</option>`).join('')}</select></label></div><div class="wrap">${S.page!=='home'&&t('untr')?`<div class="warn" style="margin-bottom:14px">${e(t('untr'))}</div>`:''}${S.toast?`<div class="ok" role="status" style="margin-bottom:14px">${e(S.toast)} <button class="btn o s" data-a="x">Dismiss</button></div>`:''}${V[S.page]()}<div class="foot">Imminent is an educational prototype, not immigration or legal advice. Sample content is labeled illustrative.</div></div></main></div>`}
const $=s=>document.querySelector(s);
const go=(p,sub)=>{S.page=p;if(p==='lang')S.langView=sub||'lessons';S.toast='';S.err='';render();scrollTo(0,0)};
const toast=m=>{S.toast=m;render()};
/* ===== USER INTERACTIONS =====
   Click handlers control navigation, timeline completion, lessons, and demo posts.
   Form handlers update settings and basic non-sensitive local preferences.
*/
let rec,chunks=[];
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-a]');if(!el||el.tagName==='SELECT'||el.tagName==='INPUT'&&el.type!=='checkbox')return;const a=el.dataset.a,v=el.dataset.v;
if(a==='nav')go(v,el.dataset.sub);else if(a==='sub'){S.langView=v;render();scrollTo(0,0)}else if(a==='tmark'){S.done[v]=!S.done[v];save();render()}else if(a==='lv'){S.lv=v;S.done.level=true;S.pick=null;save();render()}else if(a==='cx'){S.cx=v;S.pick=null;render()}
else if(a==='pick'){if(+v===-1)S.pick=null;else if(S.pick===null){S.pick=+v;if(S.pick===lesson()[4]){S.ld[lk()]=1;S.done.english=true;save()}}render()}
else if(a==='say'){if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(v);u.lang='en-US';u.rate=el.dataset.slow?.6:.9;speechSynthesis.speak(u)}else toast('Audio is not supported in this browser.')}
else if(a==='save'){S.saved[v]=!S.saved[v];save();render()}else if(a==='compose'){S.compose=!S.compose;S.err='';render()}
else if(a==='report'){S.rep[v]=1;toast('Demo only: in a real launch this would flag the post for a moderator to review.')}
else if(a==='out'){S.name='';S.compose=false;toast('Signed out of the demo profile.')}else if(a==='x'){S.toast='';render()}
else if(a==='big'){S.big=!S.big;render()}
else if(a==='rec'){if(rec&&rec.state==='recording'){rec.stop();return}if(!navigator.mediaDevices||!window.MediaRecorder)return toast('Recording is not supported in this browser.');navigator.mediaDevices.getUserMedia({audio:true}).then(m=>{rec=new MediaRecorder(m);chunks=[];rec.ondataavailable=x=>chunks.push(x.data);rec.onstop=()=>{m.getTracks().forEach(k=>k.stop());S.clip=URL.createObjectURL(new Blob(chunks));render()};rec.start();el.textContent='■ Stop recording'}).catch(()=>toast('Microphone unavailable or permission denied.'))}});
document.addEventListener('change',ev=>{const el=ev.target,a=el.dataset.a;if(!a)return;
if(a==='chk'){S.done[el.dataset.v]=el.checked;save();render()}else if(a==='L'){S.lang=el.value;save();render()}else if(a==='cult'){S.cult=el.value;render()}
else if(a==='fl'){S.fl=el.value;$('#fl-list').innerHTML=fitems()}else if(a==='ft'){S.ft=el.value;$('#fl-list').innerHTML=fitems()}});
document.addEventListener('input',ev=>{if(ev.target.dataset.a==='q'){S.q=ev.target.value;$('#fl-list').innerHTML=fitems()}});
const PII=/\b[aA][-\s]?\d{8,9}\b|\b\d{3}-\d{2}-\d{4}\b|[\w.+-]+@[\w-]+\.\w+|\b\d{3}[-.\s]\d{3}[-.\s]\d{4}\b|passport|alien registration|receipt number|case number/i;
document.addEventListener('submit',ev=>{const f=ev.target.dataset.f;if(!f)return;ev.preventDefault();const d=Object.fromEntries(new FormData(ev.target));
if(f==='personalize'){S.goal=Object.prototype.hasOwnProperty.call(GOALS,d.goal)?d.goal:'settle';S.lv=LV.includes(d.lv)?d.lv:'A1';S.done.level=true;S.county=(d.county||'').trim().slice(0,80);save();toast('Your timeline has been updated.')}
 else if(f==='county'){S.county=(d.county||'').trim().slice(0,80);save();toast(S.county?'Area set to '+S.county:'Area cleared.')}
else if(f==='cloc'){S.county=(d.county||'').trim().slice(0,80);S.cult=d.cult;S.done.community=true;save();toast('Search updated.')}
else if(f==='acct'){const n=(d.name||'').trim();if(n.length<2||PII.test(n)){return toast('Please enter a nickname (2+ characters, no personal identifiers).')}S.name=n.slice(0,30);S.pref=d.pref;S.county=(d.county||'').trim().slice(0,80);S.lv=d.lv;S.done.level=true;save();toast('Demo profile saved for this session only.')}
else if(f==='post'){const h=(d.h||'').trim(),b=(d.b||'').trim();if(h.length<5||b.length<10){S.err='Please add a title (5+ characters) and a post (10+ characters).';return render()}
if(PII.test(h+' '+b)){S.err='This looks like it may include private information (such as an email, phone, ID or case number). Please remove it and post again.';return render()}
S.posts.unshift({a:S.name,l:d.l,t:d.t,h,b,my:1});S.compose=false;S.err='';toast('Posted to this demo session only.')}});
const done=()=>{if(S.page==='imm'&&S.done)0};
render();
})();
</script></body></html>
