<style>

.main{min-width:0;padding:25px clamp(22px,4.1vw,58px) 50px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:34px}.breadcrumb{color:#a19790;font-size:12px;font-weight:600}.top-actions{display:flex;gap:9px;align-items:center}.pill{background:#fff;border:1px solid var(--border);padding:8px 13px;border-radius:99px;color:#75655d;font-size:11px;font-weight:700}.avatar{height:34px;min-width:34px;padding:0 9px;border-radius:12px;background:#ffe4ca;color:#a44f19;border:0;font-weight:800;font-size:13px}.content{max-width:1130px;margin:0 auto}.eyebrow{display:inline-flex;gap:7px;align-items:center;color:#c96a2c;font-weight:800;font-size:11px;letter-spacing:1.15px;text-transform:uppercase;margin-bottom:9px}.heading{font-size:clamp(26px,2.9vw,38px);line-height:1.14;letter-spacing:-1.35px;margin:0;color:#39251c;font-weight:820}.lead{color:#82766e;font-size:13px;line-height:1.7;max-width:680px;margin:12px 0 25px}.section-title{font-size:18px;font-weight:800;letter-spacing:-.55px;margin:0 0 15px}.section-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:34px 0 16px}.section-row .section-title{margin:0}.fine{color:#a6978c;font-size:11px}.grid{display:grid;gap:17px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:21px;box-shadow:var(--shadow);min-width:0}.card:hover{border-color:#efdac8}.c-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.c-icon{height:40px;width:40px;display:grid;place-items:center;background:#fff1e5;border-radius:13px;font-size:19px;margin-bottom:13px}.card h3{font-size:15px;line-height:1.4;letter-spacing:-.22px;margin:0 0 7px;font-weight:800}.card p{color:#83766e;font-size:12px;line-height:1.65;margin:0 0 15px}.muted{color:#8c8179}.card .micro{font-size:11px;color:#9a8f88}.mini-label{display:inline-block;color:#ad652e;font-size:10px;letter-spacing:.55px;text-transform:uppercase;font-weight:850;margin:0 0 7px}.tag{display:inline-flex;align-items:center;font-size:10px;line-height:1.2;border-radius:99px;background:#fff3e8;color:#ad5c25;font-weight:800;padding:6px 9px;white-space:nowrap}.tag.gray{background:#f5f2ef;color:#938780}.tag.green{background:#eaf7ee;color:#318065}.btn{border:0;background:var(--orange);color:#fff;border-radius:11px;padding:11px 15px;font-size:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:9px;transition:all .15s;white-space:nowrap}.btn:hover{background:var(--orange-dark);transform:translateY(-1px)}.btn.outline{background:#fff;color:#9e5223;border:1px solid #f1d9c5}.btn.outline:hover{background:#fff7f1}.btn.ghost{background:transparent;color:#b55d27;padding:8px 0}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}.textlink{color:#c2672d;font-size:11px;font-weight:850}.hero{background:linear-gradient(108deg,#ff8c35 0%,#fb741f 65%,#e85825 100%);color:#fff;border-radius:23px;padding:32px 35px;position:relative;overflow:hidden;min-height:246px;display:flex;align-items:center;box-shadow:0 18px 38px rgba(227,114,48,.15)}.hero:before,.hero:after{content:"";position:absolute;border:1px solid rgba(255,255,255,.22);width:270px;height:270px;border-radius:50%;right:-35px;top:-138px}.hero:after{width:230px;height:230px;right:57px;top:111px;border:30px solid rgba(255,255,255,.075)}.hero-content{position:relative;z-index:1;max-width:625px}.hero .eyebrow{color:#ffe7d2}.hero h1{font-size:clamp(26px,3.3vw,43px);line-height:1.11;letter-spacing:-1.6px;font-weight:820;margin:7px 0 12px;max-width:570px}.hero p{color:#ffeadc;max-width:510px;font-size:13px;line-height:1.7;margin:0 0 19px}.hero .btn{background:#fff;color:#a94f1e}.hero .btn:hover{background:#fff6ec}.stat{display:flex;gap:11px;align-items:center}.stat-big{font-weight:850;font-size:25px;letter-spacing:-1px}.progress{height:7px;background:#f7eee8;border-radius:30px;overflow:hidden;margin:13px 0}.progress span{background:#f88a43;display:block;height:100%;border-radius:30px;transition:width .2s}.checklist{display:grid;gap:2px}.checkline{display:flex;align-items:center;gap:12px;padding:12px 1px;border-bottom:1px solid #f4eeeb;cursor:pointer;font-size:12px;font-weight:650}.checkline:last-child{border:0}.checkline input{accent-color:#e87830;height:16px;width:16px}.checkline.done{color:#958a81;text-decoration:line-through}.feature{display:flex;gap:13px}.feature .c-icon{flex-shrink:0;margin:0}.feature p{margin:6px 0 0}.warning{border-radius:13px;background:#fff6e9;border:1px solid #f8e3c7;padding:13px 16px;color:#95602d;font-size:12px;line-height:1.65}.safe{border-radius:13px;background:#f0f8f4;border:1px solid #dceee2;padding:13px 16px;color:#386a54;font-size:12px;line-height:1.65}.input,.select,.textarea{display:block;border:1px solid #e8dcd3;color:#4a3427;border-radius:11px;padding:11px 12px;background:#fff;width:100%;font-size:12px;outline:none}.input:focus,.select:focus,.textarea:focus{border-color:#ed995d}.textarea{resize:vertical;min-height:105px}.label{display:block;font-size:11px;font-weight:800;color:#68564c;margin:0 0 7px}.formrow{display:flex;align-items:end;gap:10px}.formrow > div{flex:1;min-width:0}.list-row{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;border-top:1px solid #f2ece7;padding:15px 0}.list-row:first-of-type{border-top:0}.list-row strong{font-size:12px}.list-row .small{font-size:11px;color:#93867c;line-height:1.55;margin-top:3px}.level-row,.segmented{display:flex;flex-wrap:wrap;gap:7px}.level{font-weight:800;font-size:11px;background:#fff;border:1px solid #eadfd8;color:#9b8c82;border-radius:9px;padding:9px 14px}.level.active{background:#fff0e5;border-color:#f1b98c;color:#a74c18}.select-card{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #eddfd3;border-radius:12px;padding:11px 12px;cursor:pointer}.select-card.selected{border:1.5px solid #ee9b5e;background:#fff8f1}.select-card strong{font-size:12px}.select-card small{font-size:10px;color:#9b8b80;display:block}.lesson-phrase{background:#fff7ef;border-radius:13px;border:1px solid #f4dfc9;padding:17px;margin:15px 0}.lesson-phrase .quote{font-size:20px;letter-spacing:-.4px;font-weight:800;color:#713814;line-height:1.38}.lesson-phrase .mini-label{margin-bottom:6px}.option{padding:12px 13px;width:100%;text-align:left;border:1px solid #efe5dc;background:#fff;border-radius:10px;font-size:12px;color:#6d5e55;font-weight:650;margin:4px 0}.option:hover{background:#fff7ef;border-color:#f0b17e}.option.correct{background:#edfaef;border-color:#b6e3bd;color:#2f7549}.option.wrong{background:#fff1ed;border-color:#facfc0;color:#a34426}.forum-item{padding:18px 0;border-bottom:1px solid #f3e9e2}.forum-item:last-child{border-bottom:0}.forum-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:#a09389;font-size:10px;margin-bottom:8px}.forum-title{font-weight:820;font-size:14px;margin-bottom:5px}.forum-text{font-size:12px;color:#796c62;line-height:1.55}.empty{text-align:center;padding:26px;color:#8e8074;font-size:12px}.badge-pip{display:inline-block;height:7px;width:7px;border-radius:50%;background:#6db78f;margin-right:5px}.cols-uneven{display:grid;grid-template-columns:1.42fr 1fr;gap:17px}.hide{display:none!important}.spacer{height:12px}.action-strip{display:flex;align-items:center;justify-content:space-between;gap:14px;background:#fff;border:1px solid var(--border);border-radius:17px;padding:19px}.action-strip p{margin:4px 0 0;font-size:11px;color:#91847a}.smallprint{font-size:10px;color:#a49489;line-height:1.7;margin-top:17px}.footerbar{font-size:11px;color:#9b8e82;margin-top:35px;border-top:1px solid #ece1d9;padding-top:19px}.highlight{color:#aa531f;font-weight:800}.horiz{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.nowrap{white-space:nowrap}
@media(max-width:980px){.app{grid-template-columns:73px minmax(0,1fr)}.sidebar{padding:25px 11px}.brand{padding:0 4px 20px;justify-content:center}.brand-name,.brand-caption,.nav-cap,.nav-text,.side-note,.side-footer{display:none}.nav button{justify-content:center;padding:12px 8px}.nav-ico{font-size:19px;width:auto}.main{padding:22px 23px 40px}.cols-uneven{grid-template-columns:1fr}}
@media(max-width:630px){.app{display:flex;flex-direction:column}.sidebar{position:sticky;top:0;z-index:10;min-height:0;padding:10px 10px;background:rgba(255,255,255,.97);border-bottom:1px solid var(--border);border-right:0;flex-direction:row;align-items:center;gap:5px}.brand{padding:0;margin-right:auto}.brand-mark{width:32px;height:32px;font-size:19px}.nav{display:flex;flex-direction:row;gap:2px}.nav button{padding:8px 7px}.nav-ico{font-size:16px}.side-bottom{display:none}.main{padding:21px 16px 38px}.topbar{margin-bottom:23px}.top-actions .pill{display:none}.hero{padding:24px 22px;min-height:0}.hero h1{font-size:28px}.two,.three{grid-template-columns:1fr}.card{padding:18px}.formrow{align-items:stretch;flex-direction:column}.formrow .btn{width:100%}.action-strip{align-items:flex-start;flex-direction:column}.section-row{margin-top:25px}}

<body>
<div id="app"></div>
<script>
(()=>{
'use strict';
const BASE={legal:'https://www.immigrationadvocates.org/legaldirectory/',accredited:'https://www.justice.gov/eoir/recognition-accreditation-roster-reports',rights:'https://www.ilrc.org/community-resources/know-your-rights',red:'https://www.ilrc.org/redcards',scams:'https://www.uscis.gov/avoid-scams',jobs:'https://www.careeronestop.org/',english:'https://usahello.org/education/learn-english-language/',findhello:'https://usahello.org/afghan-resource-center/find-services/'};
const NAV=[['home','⌂','Dashboard'],['immigration','▤','Immigration'],['language','◉','Language support'],['community','♧','Community'],['account','♙','Log in / Profile']];
const levels=['A1','A2','B1','B2','C1','C2'];
const contexts=['Everyday life','Job interviews','School & education','Social events'];
const lessons={
'Everyday life':[
['A1','Shopping for groceries','Excuse me, how much is this?','You want to know the price. What do you say?',['How much is this?','Where is my résumé?','What time is the interview?'],0,'Ask a simple question about price.'],
['A2','Getting around town','Could you tell me which bus goes downtown?','You need help finding a bus. What is most appropriate?',['Which bus goes downtown?','What do you study?','I would like to apply.'],0,'Use a polite question to ask for directions.'],
['B1','Making an appointment','Could I reschedule my appointment for next week?','You cannot attend your appointment. What should you ask?',['Please send the menu.','Could I reschedule?','Where is the cashier?'],1,'Reschedule means arrange a different time.'],
['B2','Explaining a problem','The product seems defective; could we discuss a replacement?','Which word describes a product that does not work properly?',['Convenient','Defective','Optional'],1,'Defective means faulty.'],
['C1','Handling a complaint','I would appreciate clarification on the policy regarding refunds.','Which tone is this phrase?',['Professional and diplomatic','Angry and accusatory','Very casual'],0,'It requests information respectfully.'],
['C2','Resolving a dispute','We appear to have interpreted the agreement differently; might we revisit its terms?','What is the speaker proposing?',['Ignoring the terms','Reviewing the agreement together','Canceling without discussion'],1,'Revisit means review again.']
],
'Job interviews':[
['A1','Introducing yourself','Hello, my name is Mina. I am happy to meet you.','Which phrase is a greeting?',['I have two bags.','Happy to meet you.','I take the bus.'],1,'Use a polite greeting to start.'],
['A2','Talking about your skills','I have experience helping customers.','What does experience mean here?',['Previous practice or work','A home address','A job posting'],0,'Experience refers to things you have done.'],
['B1','Talking about strengths','One of my strengths is staying organized under pressure.','What is this person describing?',['A work strength','A shopping list','A meeting time'],0,'Strengths describe useful abilities.'],
['B2','Discussing teamwork','I collaborate effectively with colleagues from different backgrounds.','Collaborate means…',['Work together','Work alone','Leave early'],0,'Collaborate means cooperate.'],
['C1','Describing impact','I streamlined our workflow, which reduced turnaround time.','What is the main claim?',['Improved efficiency','Changed the building','Cancelled a project'],0,'Streamlined refers to simplifying a process.'],
['C2','Communicating leadership','I prioritize alignment across stakeholders while remaining responsive to changing constraints.','What quality is emphasized?',['Adaptable coordination','Refusing input','Avoiding responsibility'],0,'The speaker coordinates people and adapts.']
],
'School & education':[
['A1','Asking for help','Can you help me find my classroom?','Who might you say this to?',['A teacher or school staff member','A bank manager','A cashier'],0,'Ask a staff member for directions.'],
['A2','Contacting a teacher','I have a question about the homework assignment.','What is the topic of this sentence?',['Homework','Rent','Transportation'],0,'An assignment is schoolwork.'],
['B1','Explaining an absence','I was unable to attend class because I was sick.','What is the reason for the absence?',['Travel','Illness','A job interview'],1,'Was sick explains why the student missed class.'],
['B2','Requesting support','Would it be possible to arrange additional language support?','What is being requested?',['Extra language help','A replacement ID','A payment plan'],0,'The speaker requests support politely.'],
['C1','Advocating for access','I would like to discuss accommodations that would support my learning.','What is the speaker doing?',['Asking to discuss appropriate support','Declining to participate','Reporting attendance'],0,'Accommodations can support equal access.'],
['C2','Discussing curricula','The course objectives could be better aligned with the assessment criteria.','What is being questioned?',['Match between goals and evaluation','Classroom location','Bus routes'],0,'Alignment describes consistency between requirements.']
],
'Social events':[
['A1','Meeting new people','Hi! What is your name?','What is the speaker asking for?',['A person’s name','An address','A phone bill'],0,'This is a simple introduction.'],
['A2','Making plans','Would you like to join us for lunch?','What is this phrase?',['An invitation','A complaint','An application'],0,'Would you like is a polite invitation.'],
['B1','Joining a conversation','That sounds interesting. Could you tell me more?','What is the purpose?',['Show interest and invite explanation','End the conversation','Ask for payment'],0,'Use follow-up questions to show interest.'],
['B2','Building friendships','I have not been here long, but I am enjoying getting to know the community.','What feeling is conveyed?',['Openness to a new community','Disinterest in others','Frustration with a service'],0,'The sentence communicates openness.'],
['C1','Discussing differences','I appreciate that we may have different perspectives on the topic.','What attitude is shown?',['Respect for differences','Refusal to listen','Complete agreement'],0,'Respect does not require agreement.'],
['C2','Navigating nuance','Although our customs differ, I think we share a commitment to making others feel included.','What is the main message?',['Find common ground despite differences','Everyone has identical customs','Avoid cultural discussion'],0,'The sentence recognizes differences and shared values.']
]};
const examplePosts=[{id:1,author:'Sample member',language:'Korean',topic:'Everyday life',title:'How do I find beginner-friendly English classes?',body:'Looking for ways to practice conversation in a welcoming setting.',sample:true},{id:2,author:'Sample member',language:'Spanish',topic:'Local resources',title:'Where can I find low-cost community activities?',body:'I would love suggestions for public events and free family activities.',sample:true},{id:3,author:'Sample member',language:'English',topic:'Work & school',title:'Any tips for preparing for a first job interview?',body:'What questions should I practice before applying for a job?',sample:true}];
const state={page:'home',county:'',culture:'Korean',name:'',nativeLanguage:'Korean',level:'A1',context:'Job interviews',accent:false,quizChoice:null,done:{},posts:[],forumLanguage:'All languages',forumTopic:'All topics',showCompose:false,toast:''};
const $=(sel)=>document.querySelector(sel);
function e(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function link(url,label,variant='outline'){return `<a class="btn ${variant}" href="${e(url)}" target="_blank" rel="noopener noreferrer">${e(label)} <span aria-hidden="true">↗</span></a>`;}
function mapLink(query){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(query);}
function loc(){return state.county.trim()||'your county';}
function getLesson(){return lessons[state.context][levels.indexOf(state.level)];}
function count(){return Object.values(state.done).filter(Boolean).length;}
function notice(message){state.toast=message;render();}
function header(title,subtitle,eyebrow){return `<div class="eyebrow">✦ ${e(eyebrow||'YOUR NEW BEGINNING')}</div><h1 class="heading">${e(title)}</h1><p class="lead">${e(subtitle)}</p>`;}
function footer(){return `<div class="footerbar">Immily <b>interactive concept</b> · Educational information, not immigration or legal advice. No real user accounts, local database, or live listings are connected.</div>`;}
function home(){let n=count();return `<section class="hero"><div class="hero-content"><div class="eyebrow">✦ WELCOME TO IMMILY</div><h1>At the end of the day, we were immigrants.</h1><p>A place to find your footing, practice a new language, and stay connected to the culture that makes you, you.</p><button class="btn" data-nav="immigration">Explore your resources <span>↗</span></button></div></section>
<div class="section-row"><h2 class="section-title">Your starting point</h2><span class="fine">One step at a time</span></div>
<div class="three grid"><div class="card"><div class="c-icon">▤</div><h3>Find immigration help</h3><p>Reliable resources, legal aid directories, and important rights information.</p><button class="btn ghost" data-nav="immigration">Explore resources →</button></div><div class="card"><div class="c-icon">◉</div><h3>Practice everyday English</h3><p>Real-life lessons at your CEFR level, from interviews to social situations.</p><button class="btn ghost" data-nav="language">Start learning →</button></div><div class="card"><div class="c-icon">♧</div><h3>Find your community</h3><p>Discover cultural spaces and connect through a supportive discussion forum.</p><button class="btn ghost" data-nav="community">Find your people →</button></div></div>
<div class="section-row"><h2 class="section-title">Make yourself at home</h2><span class="fine">Simple starter checklist</span></div>
<div class="cols-uneven"><section class="card"><div class="c-head"><div><div class="mini-label">PERSONAL ROADMAP</div><h3>Little steps, big beginnings</h3></div><span class="tag">${n} / 4 complete</span></div><div class="progress" aria-label="Checklist progress"><span style="width:${n/4*100}%"></span></div><div class="checklist">${[['legal','Explore trusted legal help'],['english','Complete an English practice lesson'],['community','Explore a community space'],['privacy','Read the privacy guidance']].map(([id,label])=>`<label class="checkline ${state.done[id]?'done':''}"><input type="checkbox" data-check="${id}" ${state.done[id]?'checked':''} />${e(label)}</label>`).join('')}</div><p class="micro">This general checklist does not track immigration status or documents.</p></section>
<section class="card"><div class="mini-label">A PLACE TO BELONG</div><div class="c-icon">☀</div><h3>Find connection close to home</h3><p>Search culturally familiar spaces without sharing your exact location. ${state.county?`Your selected area: <b>${e(state.county)}</b>.`:'Choose a county in the Immigration section to personalize searches.'}</p><div class="safe">✦ You can use most of Immily without logging in. The forum requires a demo profile.</div><div class="spacer"></div><button class="btn outline" data-nav="community">Explore communities →</button></section></div>${footer()}`;}
function immigration(){return `${header('Immigration support, made clearer.','Find trusted legal information, county-based service directories, job-search support, and welcoming local spaces.','NAVIGATE WITH CONFIDENCE')}
<section class="card"><div class="c-head"><div><div class="mini-label">LOCAL SUPPORT</div><h3>Where are you looking for help?</h3><p>Enter a county and state to tailor community searches. We do not use your precise location.</p></div><span class="tag gray">Optional</span></div><form id="county-form" class="formrow"><div><label class="label" for="county">County and state</label><input class="input" id="county" name="county" maxlength="80" value="${e(state.county)}" placeholder="e.g. Sacramento County, CA" /></div><button class="btn" type="submit">Set location</button></form>${state.county?`<div class="smallprint">Searching around <b>${e(state.county)}</b>. The directory linked below lets you filter providers by county.</div>`:''}</section>
<div class="section-row"><h2 class="section-title">Legal information & ICE</h2><span class="tag gray">Verified resource links</span></div><div class="two grid">
<div class="card"><div class="c-icon">⚖</div><h3>Know your rights</h3><p>Understand your rights during immigration enforcement encounters, including ICE encounters. The Immigrant Legal Resource Center provides multilingual educational resources.</p>${link(BASE.rights,'Read rights resources')}</div>
<div class="card"><div class="c-icon">▣</div><h3>ICE encounter resources</h3><p>Access ILRC’s printable multilingual Red Cards and family preparedness information. Rights and procedures depend on the situation.</p>${link(BASE.red,'View multilingual cards')}</div>
<div class="card"><div class="c-icon">♡</div><h3>Low-cost immigration legal help</h3><p>Browse the National Immigration Legal Services Directory to find nonprofit immigration legal aid by state or county.</p>${link(BASE.legal,'Search providers by county')}</div>
<div class="card"><div class="c-icon">✓</div><h3>Find qualified representatives</h3><p>Check the U.S. Department of Justice roster for recognized organizations and accredited representatives before seeking legal advice.</p>${link(BASE.accredited,'Check DOJ roster')}</div></div>
<div class="spacer"></div><div class="warning"><b>Important:</b> Immily does not determine immigration status, eligibility, or what documents to file. For case-specific guidance, consult a licensed attorney or DOJ-accredited representative. Watch out for immigration services scams. <a href="${BASE.scams}" target="_blank" rel="noopener noreferrer"><u>USCIS scam guidance ↗</u></a></div>
<div class="section-row"><h2 class="section-title">Build your life here</h2><span class="fine">Helpful starting points</span></div><div class="two grid"><div class="card"><div class="c-icon">▦</div><h3>Job opportunities & training</h3><p>Explore job openings, nearby American Job Centers, and career training through CareerOneStop. Results come from the external provider, not Immily.</p>${link(BASE.jobs,'Find jobs & job centers')}</div><div class="card"><div class="c-icon">⌂</div><h3>Community shops & restaurants</h3><p>Discover cultural restaurants and markets near <b>${e(loc())}</b>. Listings are external search results and are not verified or endorsed as “pro-immigrant.”</p><div class="horiz">${link(mapLink((state.culture==='All cultures'?'international':state.culture)+' grocery stores '+loc()),'Find markets')}${link(mapLink((state.culture==='All cultures'?'international':state.culture)+' restaurants '+loc()),'Find restaurants')}</div></div></div>
<div class="section-row"><h2 class="section-title">Documentation & preparation</h2></div><div class="action-strip"><div><b>Keep important paperwork organized and secure.</b><p>Use a private, secure place for your records. Immily intentionally does not request or upload IDs, legal documents, or immigration status.</p></div>${link(BASE.legal,'Get document guidance')}</div>${footer()}`;}
function language(){let l=getLesson(),i=levels.indexOf(state.level);return `${header('English for real life.','Practice practical English in the moments that matter, from your first introduction to your next interview.','LEARN AT YOUR PACE')}
<div class="card"><div class="mini-label">STEP 01 · YOUR ENGLISH LEVEL</div><div class="level-row" role="group" aria-label="Choose your English level">${levels.map(v=>`<button class="level ${v===state.level?'active':''}" data-level="${v}" aria-pressed="${v===state.level}">${v}</button>`).join('')}</div><p class="micro" style="margin-top:11px;margin-bottom:0">CEFR levels are for browsing this demonstration. This is not a language assessment.</p></div>
<div class="section-row"><h2 class="section-title">Choose a situation</h2><span class="fine">Practical scenarios</span></div><div class="two grid">${contexts.map(c=>`<button class="select-card ${state.context===c?'selected':''}" data-context="${e(c)}"><span style="font-size:21px">${({'Everyday life':'🛒','Job interviews':'💼','School & education':'📚','Social events':'☕'})[c]}</span><span style="text-align:left"><strong>${e(c)}</strong><small>${state.context===c?'Current lesson':'Explore this context'}</small></span><span style="margin-left:auto;color:#b96531">${state.context===c?'✓':'›'}</span></button>`).join('')}</div>
<div class="section-row"><h2 class="section-title">Your ${e(state.level)} lesson</h2><span class="tag">${e(state.context)}</span></div>
<div class="cols-uneven"><div class="card"><div class="mini-label">LESSON · ${e(l[0])}</div><h3 style="font-size:19px">${e(l[1])}</h3><p>Read the example aloud, then test your understanding.</p><div class="lesson-phrase"><div class="mini-label">SAY THIS</div><div class="quote">“${e(l[2])}”</div></div><div class="horiz"><button class="btn" data-speak="${e(l[2])}">▶ Listen to phrase</button><button class="btn outline" data-toggle-accent="1">${state.accent?'Hide':'Try'} clarity practice</button></div>${state.accent?`<div class="safe" style="margin-top:14px"><b>Optional clarity practice</b><br>Listen, repeat, and focus on being understood. Every accent is welcome. Microphone evaluation is not connected in this demo.</div>`:''}</div>
<div class="card"><div class="mini-label">QUICK CHECK</div><h3>${e(l[3])}</h3><p>Choose one answer to check your understanding.</p>${l[4].map((choice,k)=>`<button class="option ${state.quizChoice===null?'':k===l[5]?'correct':k===state.quizChoice?'wrong':''}" data-answer="${k}">${e(choice)} ${state.quizChoice!==null&&k===l[5]?'✓':''}</button>`).join('')}${state.quizChoice!==null?`<div class="${state.quizChoice===l[5]?'safe':'warning'}" style="margin-top:10px"><b>${state.quizChoice===l[5]?'Correct!':'Try again.'}</b> ${e(l[6])}</div><div class="spacer"></div><button class="btn ghost" data-retry="1">Reset question ↻</button>`:''}</div></div>
<div class="section-row"><h2 class="section-title">Keep learning</h2></div><div class="action-strip"><div><b>Need more English support?</b><p>USAHello has free resources for learning English online and locating classes.</p></div>${link(BASE.english,'Explore free lessons')}</div>${footer()}`;}
function community(){let all=[...state.posts,...examplePosts].filter(p=>(state.forumLanguage==='All languages'||p.language===state.forumLanguage)&&(state.forumTopic==='All topics'||p.topic===state.forumTopic));let culture=state.culture==='All cultures'?'multicultural':state.culture;return `${header('Your culture. Your community.','Find places that feel familiar, discover local gatherings, and exchange advice with others.','BELONG WHEREVER YOU ARE')}
<section class="card"><div class="mini-label">DISCOVER NEAR YOU</div><h3>Find a piece of home nearby</h3><p>Search for cultural gathering places, markets, and events. You choose the area; we never access your exact GPS location.</p><form id="community-location" class="formrow"><div><label class="label" for="culture">Community or culture</label><select class="select" id="culture" name="culture">${['Korean','Mexican','Chinese','Indian','Filipino','Vietnamese','Arab','African','All cultures'].map(c=>`<option ${state.culture===c?'selected':''}>${e(c)}</option>`).join('')}</select></div><div><label class="label" for="community-county">County and state</label><input class="input" id="community-county" name="county" maxlength="80" value="${e(state.county)}" placeholder="e.g. King County, WA" /></div><button class="btn" type="submit">Update search</button></form></section>
<div class="section-row"><h2 class="section-title">Explore cultural spaces</h2><span class="fine">Opens external map searches</span></div><div class="three grid"><div class="card"><div class="c-icon">⛪</div><h3>Faith & community centers</h3><p>Search for ${e(culture)} churches, faith centers, and other gathering spaces in ${e(loc())}.</p>${link(mapLink(culture+' cultural community centers churches '+loc()),'Explore spaces')}</div><div class="card"><div class="c-icon">▧</div><h3>Markets & local shops</h3><p>Explore culturally familiar markets and independent stores in your chosen area.</p>${link(mapLink(culture+' grocery markets '+loc()),'Explore markets')}</div><div class="card"><div class="c-icon">✦</div><h3>Events & gatherings</h3><p>Discover cultural festivals, associations, and upcoming community events.</p>${link('https://www.google.com/search?q='+encodeURIComponent(culture+' community events '+loc()),'Find events')}</div></div>
<div class="section-row"><h2 class="section-title">Community conversations</h2><span class="tag gray">Demo forum</span></div><section class="card"><div class="c-head"><div><h3 style="font-size:17px">Ask a question. Share what helped.</h3><p>Browse sample discussions. Sign in to write a post in this demo session.</p></div><button class="btn" data-compose="1">+ New discussion</button></div><div class="formrow" style="margin:14px 0 7px"><div><label class="label" for="filter-lang">Language</label><select class="select" id="filter-lang" data-filter="language">${['All languages','English','Korean','Spanish','Chinese','Arabic','Hindi','Other'].map(c=>`<option ${state.forumLanguage===c?'selected':''}>${e(c)}</option>`).join('')}</select></div><div><label class="label" for="filter-topic">Topic</label><select class="select" id="filter-topic" data-filter="topic">${['All topics','Everyday life','Local resources','Work & school','Language learning'].map(c=>`<option ${state.forumTopic===c?'selected':''}>${e(c)}</option>`).join('')}</select></div></div>
${state.showCompose?(state.name?`<form id="post-form" style="padding:17px 0;border-top:1px solid #eee4dc"><div class="mini-label">NEW DISCUSSION · ${e(state.name)}</div><label class="label">Discussion title</label><input class="input" maxlength="110" name="title" required placeholder="What would you like to ask?"/><div class="spacer"></div><label class="label">Your post</label><textarea class="textarea" name="body" maxlength="1000" required placeholder="Ask for tips, resources, or everyday advice. Avoid personal legal details."></textarea><div class="spacer"></div><div class="formrow"><div><label class="label">Post language</label><select class="select" name="language">${['English','Korean','Spanish','Chinese','Arabic','Hindi','Other'].map(c=>`<option ${state.nativeLanguage===c?'selected':''}>${c}</option>`).join('')}</select></div><div><label class="label">Topic</label><select class="select" name="topic">${['Everyday life','Local resources','Work & school','Language learning'].map(c=>`<option>${c}</option>`).join('')}</select></div><button class="btn" type="submit">Publish in demo</button></div><p class="smallprint">Posts are visible only in this open prototype session. Nothing is sent to a server.</p></form>`:`<div class="warning" style="margin:15px 0">To post in the demo forum, first create a local demo profile. <button class="btn ghost" data-nav="account">Go to Log in / Profile →</button></div>`):''}
${all.length?all.map(p=>`<article class="forum-item"><div class="forum-meta"><span class="tag ${p.sample?'gray':''}">${p.sample?'Sample discussion':'Your post'}</span><span>${e(p.topic)}</span><span>· ${e(p.language)}</span></div><div class="forum-title">${e(p.title)}</div><div class="forum-text">${e(p.body)}</div><div class="forum-meta" style="margin-top:10px">Posted by ${e(p.author)} · ${p.sample?'Illustrative content':'This session only'}</div></article>`).join(''):`<div class="empty">No discussions match these filters. Try another language or topic.</div>`}
<div class="smallprint">Community guidance: do not share addresses, identification numbers, immigration case details, or other sensitive information publicly. A production forum would need verified accounts, reporting, and moderation.</div></section>${footer()}`;}
function account(){return `${header(state.name?'Your Immily profile':'Welcome to Immily.','Make a local demo profile to try the forum. Browsing and learning do not require an account.','YOUR SPACE')}
<div class="cols-uneven"><div class="card"><div class="mini-label">${state.name?'DEMO PROFILE ACTIVE':'DEMO SIGN IN'}</div>${state.name?`<div class="c-icon">☺</div><h3>Hello, ${e(state.name)}!</h3><p>Your demo profile is active in this browser session. This is not a secure account; the data is not saved to a server.</p><div class="list-row"><div><strong>Preferred language</strong><div class="small">${e(state.nativeLanguage)}</div></div></div><div class="list-row"><div><strong>County</strong><div class="small">${e(loc())}</div></div></div><button class="btn outline" data-logout="1">Sign out of demo</button>`:`<h3>Join the community, on your terms.</h3><p>A display name is all you need to test posting. Please use a nickname, not your legal name.</p><form id="account-form"><label class="label" for="name">Display name</label><input class="input" id="name" name="name" maxlength="30" minlength="2" required placeholder="e.g. Sunny" autocomplete="off"/><div class="spacer"></div><label class="label" for="native">Preferred language</label><select id="native" class="select" name="nativeLanguage">${['Korean','English','Spanish','Chinese','Arabic','Hindi','Other'].map(c=>`<option ${state.nativeLanguage===c?'selected':''}>${c}</option>`).join('')}</select><div class="spacer"></div><button class="btn" type="submit">Continue with demo profile →</button><p class="smallprint">No password is requested because this is only a front-end prototype. Do not enter private information.</p></form>`}</div>
<div class="card"><div class="c-icon">♧</div><h3>Privacy comes first</h3><p>Immigration status can be highly sensitive. Immily is designed so newcomers can access help without disclosing it.</p><div class="safe"><b>Design principles</b><br>• Browse without signing in<br>• Share only broad location such as county<br>• Never upload IDs or legal documents<br>• Require accounts only for community posting<br>• Moderate public content before real launch</div><div class="spacer"></div><button class="btn ghost" data-nav="community">Explore the community →</button></div></div>${footer()}`;}
function render(){const names={home:'Dashboard',immigration:'Immigration',language:'Language support',community:'Community',account:'Log in / Profile'};$('#app').innerHTML=`<div class="app"><aside class="sidebar"><div class="brand"><div class="brand-mark" aria-hidden="true">✳</div><div><div class="brand-name">immily<span style="color:#ef782c">.</span></div><div class="brand-caption">Find your place</div></div></div><div class="nav-cap">EXPLORE</div><nav class="nav" aria-label="Main navigation">${NAV.map(([id,ico,label])=>`<button data-nav="${id}" class="${state.page===id?'active':''}" aria-current="${state.page===id?'page':'false'}" title="${e(label)}"><span class="nav-ico" aria-hidden="true">${ico}</span><span class="nav-text">${e(label)}</span></button>`).join('')}</nav><div class="side-bottom"><div class="side-note"><div class="side-note-title">☀ Here, you're welcome.</div><p>Resources, language, and community for every new beginning.</p></div><div class="side-footer">IMMILY · 2026 CONCEPT DEMO</div></div></aside><main class="main"><div class="topbar"><span class="breadcrumb">Immily <span style="color:#c7b8ad">/</span> ${e(names[state.page])}</span><div class="top-actions"><span class="pill">✦ Interactive prototype</span><button class="avatar" title="Open profile" data-nav="account">${e(state.name?state.name[0].toUpperCase():'☺')}</button></div></div><div class="content">${state.toast?`<div role="status" class="safe" style="margin-bottom:16px">${e(state.toast)} <button class="btn ghost" data-dismiss="1" style="margin-left:10px">Dismiss</button></div>`:''}${({home,immigration,language,community,account})[state.page]()}</div></main></div>`;}
function navigate(page){state.page=page;state.toast='';render();window.scrollTo?.({top:0,behavior:'instant'});}
document.addEventListener('click',evt=>{let el=evt.target.closest('[data-nav],[data-level],[data-context],[data-answer],[data-retry],[data-toggle-accent],[data-compose],[data-logout],[data-dismiss],[data-speak]');if(!el)return;
if(el.dataset.nav){navigate(el.dataset.nav);return;}
if(el.dataset.level){state.level=el.dataset.level;state.quizChoice=null;render();return;}
if(el.dataset.context){state.context=el.dataset.context;state.quizChoice=null;render();return;}
if('answer'in el.dataset){state.quizChoice=Number(el.dataset.answer);if(state.quizChoice===getLesson()[5])state.done.english=true;render();return;}
if(el.dataset.retry){state.quizChoice=null;render();return;}
if(el.dataset.toggleAccent){state.accent=!state.accent;render();return;}
if(el.dataset.compose){state.showCompose=!state.showCompose;render();return;}
if(el.dataset.logout){state.name='';state.showCompose=false;notice('Signed out of the demo profile.');return;}
if(el.dataset.dismiss){state.toast='';render();return;}
if(el.dataset.speak){if('speechSynthesis'in window){try{window.speechSynthesis.cancel();let msg=new SpeechSynthesisUtterance(el.dataset.speak);msg.lang='en-US';msg.rate=.86;window.speechSynthesis.speak(msg);}catch(err){alert('Audio playback is unavailable in this environment.');}}else alert('Speech playback is not available in this browser.');return;}
});
document.addEventListener('change',evt=>{let el=evt.target;if(el.dataset.check){state.done[el.dataset.check]=el.checked;render();return;}if(el.dataset.filter==='language'){state.forumLanguage=el.value;render();return;}if(el.dataset.filter==='topic'){state.forumTopic=el.value;render();return;}});
document.addEventListener('submit',evt=>{let id=evt.target.id;if(!['county-form','community-location','account-form','post-form'].includes(id))return;evt.preventDefault();let fd=new FormData(evt.target);
if(id==='county-form'){state.county=String(fd.get('county')||'').trim().slice(0,80);notice(state.county?'Search area set to '+state.county+'.':'Search area cleared.');}
if(id==='community-location'){state.county=String(fd.get('county')||'').trim().slice(0,80);state.culture=String(fd.get('culture')||'All cultures');state.done.community=true;notice('Community search preferences updated.');}
if(id==='account-form'){state.name=String(fd.get('name')||'').trim().slice(0,30);state.nativeLanguage=String(fd.get('nativeLanguage')||'English');if(state.name.length<2){notice('Please enter a display name with at least 2 characters.');return;}notice('Demo profile active. You can now post in the community forum.');}
if(id==='post-form'){if(!state.name){navigate('account');return;}let title=String(fd.get('title')||'').trim().slice(0,110),body=String(fd.get('body')||'').trim().slice(0,1000);if(!title||!body)return;state.posts.unshift({id:Date.now(),author:state.name,language:String(fd.get('language')||'English'),topic:String(fd.get('topic')||'Everyday life'),title,body,sample:false});state.showCompose=false;state.forumLanguage='All languages';state.forumTopic='All topics';notice('Your discussion was added to this demo session.');}
});
render();
})();
</script>
</body>
</html>
