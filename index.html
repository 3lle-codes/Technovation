  Main website file: index.html

  Site structure:
  - My Timeline: personalized first page and progress checklist
  - Immigration: trusted resources and county-level searches
  - Language Support: Everyday Lessons and separate Pronunciation Studio subpage
  - Communities Around You: discover local cultural spaces

const JOURNEY_CATEGORIES=['All services','Housing','Legal help','Education','English learning','Jobs','Health care','Food & essentials','Transportation','Community'];
const JOURNEY_LANGUAGES=['All languages','English','Spanish','Korean','Chinese','Vietnamese','Arabic','Other'];
const allJourneyTasks=()=>[...JOURNEY.flatMap(stage=>stage.tasks),...S.customTasks];
const findTask=id=>allJourneyTasks().find(task=>task.id===id);
const taskState=task=>S.journey[task.id]||{status:'not-started',notes:'',date:''};
const activeTasks=()=>allJourneyTasks().filter(task=>taskState(task).status!=='skipped');
const journeyProgress=()=>{const tasks=activeTasks(),completed=tasks.filter(task=>taskState(task).status==='completed').length;return {completed,total:tasks.length,percent:tasks.length?Math.round(completed/tasks.length*100):0}};
const nextJourneyTask=()=>activeTasks().find(task=>taskState(task).status!=='completed');
const stageProgress=stage=>{const tasks=stage.tasks.filter(task=>taskState(task).status!=='skipped'),completed=tasks.filter(task=>taskState(task).status==='completed').length;return {completed,total:tasks.length,percent:tasks.length?Math.round(completed/tasks.length*100):0}};
const stageForTask=id=>JOURNEY.find(stage=>stage.tasks.some(task=>task.id===id))||{id:'personal',title:'My personal tasks'};
const taskStatusLabel=status=>({'not-started':'Not started','in-progress':'In progress',completed:'Completed',skipped:'Skipped'}[status]||'Not started');
const taskFinderCategory=id=>({'understand-renting':'Housing','find-housing-help':'Housing','find-legal-help':'Legal help','job-applications':'Jobs','interview-preparation':'Jobs'}[id]||'All services');
const targetDateLabel=value=>value?new Date(value+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}):'No target date';

function journeyTaskCard(task){
  const state=taskState(task),stage=stageForTask(task.id);
  return `<details class="task" id="task-${e(task.id)}" data-status="${e(state.status)}" ${S.openTask===task.id?'open':''}>
<summary><span class="task-marker" aria-hidden="true"></span><span style="min-width:0"><span class="task-title">${e(task.title)}</span><span class="task-meta"><span>${e(stage.title)}</span><span aria-hidden="true">·</span><span>${e(taskStatusLabel(state.status))}</span><span>Estimated ${e(task.time)}</span>${state.date?`<span aria-hidden="true">·</span><span>Target ${e(targetDateLabel(state.date))}</span>`:''}</span></span></summary>
<div class="task-content">
<div><h3>What you need to do</h3><p>${e(task.what)}</p></div><div><h3>Why it matters</h3><p>${e(task.why)}</p></div>
<div><h3>How to do it</h3><ol>${task.how.map(step=>`<li>${e(step)}</li>`).join('')}</ol></div><div><h3>What you may need</h3><p>${e(task.needs)}</p></div>
<div class="warn"><b>General educational information:</b> This is not legal, financial, housing, or benefits advice. Rules and services vary by location and individual circumstances. Confirm details with an official source or qualified provider.</div>
${task.obstacle?`<section class="obstacle"><h3>${e(task.obstacle.title)}</h3><p>${e(task.obstacle.text)}</p><h3 style="margin-top:11px">Helpful words</h3><ul>${task.obstacle.vocabulary.map(word=>`<li>${e(word)}</li>`).join('')}</ul><p style="margin-top:10px"><b>Try saying:</b> ${e(task.obstacle.phrase)}</p><div class="task-tools" style="margin-top:12px"><button class="btn o s" data-a="openFinder" data-category="${e(taskFinderCategory(task.id))}">Find local support by county and language</button>${task.id==='interview-preparation'||task.id==='job-applications'?'<button class="btn o s" data-a="nav" data-v="lang">Practice English phrases</button>':''}</div></section>`:''}
<div><h3>Helpful resources</h3><div class="task-resources">${task.resources.map(id=>{const r=JOURNEY_RESOURCES[id];return r?`<article class="task-resource"><span class="tag gr">${e(r.kind)}</span><h3 style="margin-top:7px">${e(r.name)}</h3><p>${e(r.detail)}</p>${ext(r.url,'Visit resource','o s')}</article>`:''}).join('')}</div></div>
<div class="task-control-grid"><div><label for="status-${e(task.id)}">Progress status</label><select class="inp" id="status-${e(task.id)}" data-a="taskStatus" data-taskid="${e(task.id)}"><option value="not-started" ${state.status==='not-started'?'selected':''}>Not started</option><option value="in-progress" ${state.status==='in-progress'?'selected':''}>In progress</option><option value="completed" ${state.status==='completed'?'selected':''}>Completed</option></select></div><div><label for="date-${e(task.id)}">Optional target date</label><input class="inp" type="date" id="date-${e(task.id)}" data-a="taskDate" data-taskid="${e(task.id)}" value="${e(state.date||'')}"></div></div>
<div><label for="notes-${e(task.id)}">Personal notes (stored only in this browser)</label><textarea class="inp" rows="3" maxlength="1200" id="notes-${e(task.id)}" data-a="taskNotes" data-taskid="${e(task.id)}" placeholder="Write questions, reminders, or next steps for yourself. Avoid sensitive case or document numbers.">${e(state.notes||'')}</textarea></div>
<div class="task-tools">${state.status==='skipped'?`<button class="btn o s" data-a="restoreTask" data-taskid="${e(task.id)}">Add this task back</button>`:`<button class="btn o s" data-a="skipTask" data-taskid="${e(task.id)}">Skip — not relevant to me</button>`}</div>
${task.related?.length?`<div><h3>Related tasks</h3><div class="task-related">${task.related.map(id=>{const related=findTask(id);return related?`<button class="btn o s" data-a="openTask" data-taskid="${e(id)}">${e(related.title)} →</button>`:''}).join('')}</div></div>`:''}
</div></details>`;
}
function resourceFinder(){
  const locValue=(S.rfCounty||S.county||'').trim(),category=S.rfCategory||'All services',language=S.rfLanguage||'All languages';
  const terms=[category==='All services'?'newcomer support':category,language==='All languages'?'':language,locValue].filter(Boolean).join(' ');
  const webQuery='https://www.google.com/search?q='+encodeURIComponent(terms+' local services');
  const mapQuery=map(`${category==='All services'?'community services':category} ${language==='All languages'?'':language} ${locValue||'United States'}`);
  return `<section class="card" id="resource-finder"><div class="eb">Search support that fits your situation</div><h2 style="margin-top:4px">Find local resources</h2><p>Choose a county, language, and service category. Imminent does not have a live local-provider database; links open external directories or unverified searches. Confirm availability, language access, cost, and eligibility directly with each organization.</p>

<div class="finder-card"><h3>Search outside this app</h3><p class="sm">Search terms: <b>${e(terms||'newcomer support')}</b>. External search results are not reviewed or endorsed by Imminent.</p><div class="task-tools">${ext(webQuery,'Search web','o s')}${ext(mapQuery,'Search maps','o s')}</div></div></div></section>`;
}

function personalTasksView(){return S.customTasks.map(task=>journeyTaskCard(task)).join('')}
function journey(){
  const progress=journeyProgress(),next=nextJourneyTask(),active=activeTasks();
  return `${journeyLanguageNote()}<div class="eb">A flexible guide for settling into life in the United States</div><h1>My U.S. Journey</h1><p class="lead">Choose the steps that fit your life right now. Stages are suggestions, not rules. Skip what does not apply, return whenever you need, and open a task for practical guidance and support.</p>

<div class="warn" style="margin-bottom:20px"><b>Privacy and prototype limits:</b> Progress, dates, and notes are stored in this browser only. They are not sent to a server and may be lost if browser storage is cleared or unavailable. Avoid entering sensitive immigration or identity information.</div>

function journeyDashboard(){
 const progress=journeyProgress(),next=nextJourneyTask();
 const unfinished=activeTasks().filter(task=>taskState(task).status!=='completed').slice(0,3);

else if(a==='big'){S.big=!S.big;render()}
else if(a==='rec'){if(rec&&rec.state==='recording'){rec.stop();return}if(!navigator.mediaDevices||!window.MediaRecorder)return toast('Recording is not supported in this browser.');navigator.mediaDevices.getUserMedia({audio:true}).then(m=>{rec=new MediaRecorder(m);chunks=[];rec.ondataavailable=x=>chunks.push(x.data);rec.onstop=()=>{m.getTracks().forEach(k=>k.stop());S.clip=URL.createObjectURL(new Blob(chunks));render()};rec.start();el.textContent='■ Stop recording'}).catch(()=>toast('Microphone unavailable or permission denied.'))}});
document.addEventListener('change',ev=>{const el=ev.target,a=el.dataset.a;if(!a)return;
if(a==='chk'){S.done[el.dataset.v]=el.checked;save();render()}else if(a==='L'){S.lang=el.value;save();render()}else if(a==='cult'){S.cult=el.value;render()}

const PII=/\b[aA][-\s]?\d{8,9}\b|\b\d{3}-\d{2}-\d{4}\b|[\w.+-]+@[\w-]+\.\w+|\b\d{3}[-.\s]\d{3}[-.\s]\d{4}\b|passport|alien registration|receipt number|case number/i;
document.addEventListener('submit',ev=>{const f=ev.target.dataset.f;if(!f)return;ev.preventDefault();const d=Object.fromEntries(new FormData(ev.target));
if(f==='personalize'){S.goal=Object.prototype.hasOwnProperty.call(GOALS,d.goal)?d.goal:'settle';S.lv=LV.includes(d.lv)?d.lv:'A1';S.done.level=true;S.county=(d.county||'').trim().slice(0,80);save();toast('Your timeline has been updated.')}
 else if(f==='county'){S.county=(d.county||'').trim().slice(0,80);save();toast(S.county?'Area set to '+S.county:'Area cleared.')}
else if(f==='cloc'){S.county=(d.county||'').trim().slice(0,80);S.cult=d.cult;S.done.community=true;save();toast('Search updated.')}
else if(f==='acct'){const n=(d.name||'').trim();if(n.length<2||PII.test(n)){return toast('Please enter a nickname (2+ characters, no personal identifiers).')}S.name=n.slice(0,30);S.pref=d.pref;S.county=(d.county||'').trim().slice(0,80);S.lv=d.lv;S.done.level=true;save();toast('Demo profile saved for this session only.')}
else if(f==='post'){const h=(d.h||'').trim(),b=(d.b||'').trim();if(h.length<5||b.length<10){S.err='Please add a title (5+ characters) and a post (10+ characters).';return render()}
if(PII.test(h+' '+b)){S.err='This looks like it may include private information (such as an email, phone, ID or case number). Please remove it and post again.';return render()}
S.posts.unshift({a:S.name,l:d.l,t:d.t,h,b,my:1});S.compose=false;S.err='';toast('Posted to this demo session only.')}});

document.addEventListener('click',ev=>{const el=ev.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,id=el.dataset.taskid;if(a==='openTask'&&id){S.openTask=id;go('journey');requestAnimationFrame(()=>document.getElementById('task-'+id)?.scrollIntoView({behavior:'smooth',block:'center'}))}else if(a==='skipTask'&&id){S.journey[id]={...(S.journey[id]||{}),status:'skipped'};if(S.openTask===id)S.openTask='';save();render()}else if(a==='restoreTask'&&id){S.journey[id]={...(S.journey[id]||{}),status:'not-started'};save();render()}else if(a==='openFinder'){S.rfCategory=el.dataset.category||'All services';S.openTask='';go('journey');requestAnimationFrame(()=>document.getElementById('resource-finder')?.scrollIntoView({behavior:'smooth',block:'start'}))}else if(a==='scrollTo'){document.getElementById(el.dataset.target)?.scrollIntoView({behavior:'smooth',block:'start'})}});

const done=()=>{if(S.page==='imm'&&S.done)0};
render();
