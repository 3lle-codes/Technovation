${t('untr')?`<div class="warn" style="margin-top:16px">${e(t('untr'))}</div>`:''}
<h2>${e(t('start'))}</h2><div class="g g3">
<div class="card"><h3>${e(t('c1'))}</h3><p>Trusted sources, legal-aid directories, and rights information.</p><button class="btn o" data-a="nav" data-v="imm">${e(t('imm'))} →</button></div>
<div class="card"><h3>${e(t('c2'))}</h3><p>Real-life lessons by CEFR level, with audio and quizzes.</p><button class="btn o" data-a="nav" data-v="lang">${e(t('lang'))} →</button></div>

<div class="g g2" style="margin-top:16px"><section class="card"><div class="row" style="align-items:center"><h3 style="margin:0">${e(t('road'))}</h3><span class="tag">${n} / 4 ${e(t('done'))}</span></div><div class="bar" role="progressbar" aria-valuenow="${n}" aria-valuemin="0" aria-valuemax="4"><i style="width:${n*25}%"></i></div>
${[['legal','k1'],['english','k2'],['community','k3'],['privacy','k4']].map(([i,k])=>`<label class="chk ${S.done[i]?'d':''}"><input type="checkbox" data-a="chk" data-v="${i}" ${S.done[i]?'checked':''}><span>${e(t(k))}</span></label>`).join('')}<p class="sm" style="margin:10px 0 0">General steps only. Immily does not know or track your immigration status or documents.</p></section>
<section class="card"><div class="eb">Recommended next step</div><h3 style="margin-top:6px">${S.county?'Find community near '+e(S.county):'Set your county to personalize searches'}</h3><p>Immily uses only a county you type — never your GPS location. Most features work without an account.</p><button class="btn" data-a="nav" data-v="${S.county?'com':'imm'}">${S.county?'Explore communities':'Set my county'} →</button></section></div>
<div class="card" style="margin-top:16px"><div class="row" style="align-items:center"><div><h3>${e(t('cont'))}</h3><p style="margin:0">${e(S.cx)} · ${S.lv} — ${Object.keys(S.ld).length} lessons completed</p></div><button class="btn" data-a="nav" data-v="lang" style="flex:none">${e(t('lang'))} →</button></div></div>
<h2>${e(t('rec'))}</h2><div class="g g3">${['dir','scam','eng'].map(id=>resCard(RES.find(r=>r.id===id))).join('')}</div>`}
function imm(){const g=s=>RES.filter(r=>r.s===s).map(resCard).join('');const c=S.cult;return `<div class="eb">Immigration & settling in</div><h1>${e(t('ih'))}</h1><p class="lead">Links go to the organization named on each card. Last check of links: not yet done for this draft — re-verify before launch.</p>
<div class="warn"><b>General education, not legal advice.</b> Immily cannot tell you about your case, eligibility, or what to file. For that, talk to a licensed attorney or DOJ-accredited representative. For rights materials in your language, use the translated versions on the source sites.</div>
<h2>${e(t('s1'))}</h2><div class="g g2">${g('legal')}</div>
<h2>${e(t('s2'))}</h2><section class="card"><p>Enter a county and state. Immily has <b>no live local database</b> — it points you to a national directory you can filter by county.</p><form data-f="county" class="row"><div><label for="cty">County and state</label><input class="inp" id="cty" name="county" maxlength="80" value="${e(S.county)}" placeholder="e.g. Sacramento County, California"></div><button class="btn">Set location</button></form>
<ol class="sm"><li>Open the Legal Services Directory.</li><li>Enter ${e(loc())} and choose the kind of help you need.</li><li>Confirm the provider is a nonprofit or DOJ-accredited before sharing documents.</li></ol><div class="row" style="gap:8px">${ext(RES[3].u,'Directory (verified national source)')}${ext('https://www.google.com/search?q='+encodeURIComponent('immigration legal services nonprofit '+loc()),'Web search (unverified results)','o')}</div></section>
<h2>${e(t('s3'))}</h2><div class="g g2">${g('jobs')}</div><p class="sm">No live job listings are connected. Results come from the external sites above.</p>
<h2>${e(t('s4'))}</h2><section class="card"><p>External map searches near ${e(loc())}. These are cultural/community-oriented searches — not verified or endorsed businesses.</p><div class="row"><div><label for="cu">Culture</label><select class="inp" id="cu" data-a="cult">${CULT.map(x=>`<option ${x===c?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="row" style="gap:8px;margin-top:12px">${ext(map(c+' grocery market '+loc()),'Markets & groceries','o')}${ext(map(c+' restaurants '+loc()),'Restaurants','o')}${ext(map(c+' independent shops '+loc()),'Independent shops','o')}</div></section>`}
function lang(){const l=lesson(),k=lk(),i=LV.indexOf(S.lv),tot=Object.values(LS).reduce((n,a)=>n+a.length,0),dn=Object.keys(S.ld).length;const p=S.pick;
return `<div class="eb">Learn at your pace</div><h1>${e(t('lh'))}</h1><p class="lead">Practical phrases for everyday moments. Nine everyday situations. Some have three lessons (A1, B1, C1); other levels show the closest one.</p>
<div class="card"><label>Your level (browsing only — not an assessment)</label><div class="lv" role="group">${LV.map(v=>`<button data-a="lv" data-v="${v}" class="${v===S.lv?'on':''} ${S.ld[key(S.cx,v)]?'dn':''}" aria-pressed="${v===S.lv}">${v}</button>`).join('')}</div>
<div class="cx" role="group">${CX.map(c=>`<button data-a="cx" data-v="${e(c)}" class="${c===S.cx?'on':''}">${e(c)}</button>`).join('')}</div>
<div class="bar"><i style="width:${dn/tot*100}%"></i></div><span class="sm">${dn} of ${tot} lessons completed</span></div>
<div class="g g2" style="margin-top:16px"><section class="card"><span class="tag">${e(S.cx)} · ${S.lv}</span>${LS[S.cx].length<6&&!'A1B1C1'.includes(S.lv)?' <span class="tag gr">closest available lesson</span>':''}<h3 style="margin-top:10px">${e(l[0])}</h3><div class="q">“${e(l[1])}”</div><button class="btn" data-a="say" data-v="${e(l[1])}">▶ Listen</button>
<h3 style="margin-top:16px">Vocabulary</h3><p>${e(l[6])}</p><h3>Why it works</h3><p>${e(l[7])}</p></section>
<section class="card"><div class="eb">Quick check</div><h3 style="margin-top:6px">${e(l[2])}</h3>${l[3].map((c,j)=>`<button class="opt ${p===null?'':j===l[4]?'c':j===p?'w':''}" data-a="pick" data-v="${j}" ${p!==null?'aria-disabled="true"':''}>${e(c)}${p!==null&&j===l[4]?' ✓':''}</button>`).join('')}
${p!==null?`<div class="${p===l[4]?'ok':'warn'}" role="status" style="margin-top:10px"><b>${p===l[4]?'Correct!':'Not quite.'}</b> ${e(l[5])}</div><div class="row" style="gap:8px;margin-top:10px"><button class="btn o s" data-a="pick" data-v="-1">Try again</button>${i<5?`<button class="btn s" data-a="lv" data-v="${LV[i+1]}">Next lesson →</button>`:''}</div>`:''}</section></div>
<h2>Pronunciation practice <span class="tag gr">Demonstration</span></h2><section class="card"><p>The goal is to be understood — every accent is welcome. Listen to the phrase, say it aloud at your own pace, and listen again. <b>No microphone analysis is connected:</b> this feature cannot score your speech.</p><button class="btn o" data-a="say" data-v="${e(l[1])}">▶ Listen again</button> <button class="btn o" data-a="say" data-v="${e(l[1])}" data-slow="1">▶ Slower</button> <button class="btn o" data-a="rec">● Record yourself</button>${S.clip?`<audio controls src="${S.clip}" style="display:block;margin-top:12px"></audio>`:''}<p class="sm" style="margin:10px 0 0">Recordings stay in your browser for you to compare by ear; nothing is uploaded or scored.</p></section>
<div class="foot">More free lessons: ${ext(RES[7].u,'USAHello','o')}</div>`}
function fitems(){const q=S.q.trim().toLowerCase();const a=[...S.posts,...POSTS].filter(p=>(S.fl==='All'||p.l===S.fl)&&(S.ft==='All'||p.t===S.ft)&&(!q||(p.h+' '+p.b).toLowerCase().includes(q)));
return a.length?a.map((p,j)=>`<article class="fi"><div class="meta"><span class="tag ${p.my?'':'gr'}">${p.my?'Your post (this session)':'Illustrative sample'}</span><span>${e(p.t)} · ${e(p.l)}</span></div><h3>${e(p.h)}</h3><p style="margin:0 0 8px;color:var(--mut)">${S.rep[p.h]?'<i>Hidden pending moderator review (demo).</i>':e(p.b)}</p><div class="meta">By ${e(p.a)} <button class="btn o s" data-a="report" data-v="${e(p.h)}" ${S.rep[p.h]?'disabled':''}>${S.rep[p.h]?'Reported (demo)':'⚑ Report (demo)'}</button></div></article>`).join(''):'<p class="sm" style="padding:16px 0">No discussions match. Try other filters.</p>'}
function com(){const c=S.cult;return `<div class="eb">Belong wherever you are</div><h1>${e(t('ch'))}</h1><p class="lead">Find familiar places through external map searches. Immily does not list or verify businesses or events.</p>
<section class="card"><form data-f="cloc" class="row"><div><label for="cu2">Community</label><select class="inp" id="cu2" name="cult">${CULT.map(x=>`<option ${x===c?'selected':''}>${x}</option>`).join('')}</select></div><div><label for="ct2">County and state</label><input class="inp" id="ct2" name="county" maxlength="80" value="${e(S.county)}" placeholder="e.g. King County, Washington"></div><button class="btn">Update</button></form></section>
<div class="g g3" style="margin-top:16px">${[['Churches & religious centers',c+' church temple mosque '+loc()],['Cultural organizations & community centers',c+' cultural community center '+loc()],['Grocery stores & markets',c+' grocery market '+loc()],['Restaurants',c+' restaurant '+loc()]].map(([h,q])=>`<div class="card"><h3>${h}</h3><p>${e(c)}, near ${e(loc())}.</p>${ext(map(q),'Search maps','o')}</div>`).join('')}<div class="card"><h3>Festivals & events</h3><p>Check each organizer's site before attending.</p>${ext('https://www.google.com/search?q='+encodeURIComponent(c+' cultural festival events '+loc()),'Search events','o')}</div></div>
<h2>${e(t('fh'))} <span class="tag gr">Prototype</span></h2><section class="card"><div class="warn" style="margin-bottom:14px"><b>Guidelines:</b> Be kind. Never post names of others, addresses, ID or case numbers, or legal documents. Do not share immigration case details. Posts here exist only in this browser tab and are not stored on a server. Reporting is a demo; a real launch needs moderators.</div>
<div class="row"><div style="flex:2"><label for="fq">${e(t('find'))}</label><input class="inp" id="fq" data-a="q" value="${e(S.q)}"></div><div><label for="fl">Language</label><select class="inp" id="fl" data-a="fl">${['All',...LANGS].map(x=>`<option ${x===S.fl?'selected':''}>${x}</option>`).join('')}</select></div><div><label for="ft">Topic</label><select class="inp" id="ft" data-a="ft">${['All',...TOPICS].map(x=>`<option ${x===S.ft?'selected':''}>${x}</option>`).join('')}</select></div><button class="btn" data-a="compose">${e(t('newp'))}</button></div>
${S.compose?(S.name?`<form data-f="post" style="margin-top:14px"><label for="ph">Title</label><input class="inp" id="ph" name="h" maxlength="110" required><label for="pb" style="margin-top:10px">Post</label><textarea class="inp" id="pb" name="b" maxlength="800" rows="4" required></textarea><div class="row" style="margin-top:10px"><div><label for="pl">Language</label><select class="inp" id="pl" name="l">${LANGS.map(x=>`<option ${x===S.pref?'selected':''}>${x}</option>`).join('')}</select></div><div><label for="pt">Topic</label><select class="inp" id="pt" name="t">${TOPICS.map(x=>`<option>${x}</option>`).join('')}</select></div><button class="btn">Post (demo)</button></div>${S.err?`<div class="warn" role="alert" style="margin-top:10px">${e(S.err)}</div>`:''}</form>`:`<div class="warn" style="margin-top:14px">Create a demo profile to post. <button class="btn s" data-a="nav" data-v="acc">Go to profile →</button></div>`):''}
<div id="fl-list" style="margin-top:8px">${fitems()}</div></section>`}
function acc(){const sv=RES.filter(r=>S.saved[r.id]);return `<div class="eb">Your space</div><h1>${S.name?e(t('hello'))+', '+e(S.name):e(t('acc'))}</h1><p class="lead"><b>Demo profile only</b> — not a secure account. No password or server; nothing here is stored permanently. You only need a profile to post in the forum.</p>
<div class="g g2"><section class="card"><form data-f="acct"><label for="nm">Display name (a nickname is fine)</label><input class="inp" id="nm" name="name" minlength="2" maxlength="30" required value="${e(S.name)}" autocomplete="off"><label for="pf" style="margin-top:10px">Preferred language</label><select class="inp" id="pf" name="pref">${LANGS.map(x=>`<option ${x===S.pref?'selected':''}>${x}</option>`).join('')}</select><label for="pc" style="margin-top:10px">County (general location)</label><input class="inp" id="pc" name="county" maxlength="80" value="${e(S.county)}"><label for="pv" style="margin-top:10px">English level</label><select class="inp" id="pv" name="lv">${LV.map(x=>`<option ${x===S.lv?'selected':''}>${x}</option>`).join('')}</select><div style="margin-top:14px"><button class="btn">${S.name?'Save profile':'Continue with demo profile'}</button> ${S.name?'<button type="button" class="btn o" data-a="out">Sign out</button>':''}</div></form></section>
<section class="card"><h3>Privacy first</h3><div class="ok">Immily never asks for immigration status, passport or A-numbers, or legal documents. Only a display name, language, level and broad location are used.</div><h3 style="margin-top:16px">Saved resources (${sv.length})</h3>${sv.length?sv.map(r=>`<p style="margin:6px 0">${ext(r.u,r.t,'o s')}</p>`).join(''):'<p class="sm">Nothing saved yet. Use ☆ Save on resource cards.</p>'}<h3>Learning progress</h3><p>${Object.keys(S.ld).length} lessons completed</p></section></div>`}
function render(){const V={home,imm,lang,com,acc},N=[['home','⌂'],['imm','▤'],['lang','◉'],['com','♧'],['acc','♙']];
document.documentElement.lang=S.lang;document.body.style.fontSize=S.big?'18px':'';
$('#app').innerHTML=`<a class="skip" href="#main">Skip to content</a><div class="app"><aside class="side"><div class="brand"><span class="mark" aria-hidden="true">✳</span>immily</div><nav class="nav" aria-label="Main">${N.map(([k,i])=>`<button data-a="nav" data-v="${k}" class="${S.page===k?'on':''}" ${S.page===k?'aria-current="page"':''}><span aria-hidden="true">${i}</span><span>${e(t(k))}</span></button>`).join('')}</nav><div class="note"><b>Prototype.</b> No backend, live listings or real accounts are connected.</div></aside>
<main class="main" id="main" tabindex="-1"><div class="top"><span class="pill">Interactive prototype</span><button class="pill" data-a="big" aria-pressed="${!!S.big}">A+ Larger text</button><label class="sm" style="margin:0">🌐 <select data-a="L" aria-label="Language">${Object.keys(T).map(k=>`<option value="${k}" ${k===S.lang?'selected':''}>${T[k].n}</option>`).join('')}</select></label></div><div class="wrap">${S.page!=='home'&&t('untr')?`<div class="warn" style="margin-bottom:14px">${e(t('untr'))}</div>`:''}${S.toast?`<div class="ok" role="status" style="margin-bottom:14px">${e(S.toast)} <button class="btn o s" data-a="x">Dismiss</button></div>`:''}${V[S.page]()}<div class="foot">Immily is an educational prototype, not immigration or legal advice. Sample content is labeled illustrative.</div></div></main></div>`}
const $=s=>document.querySelector(s);
const go=(p)=>{S.page=p;S.toast='';S.err='';render();scrollTo(0,0)};
const toast=m=>{S.toast=m;render()};
/* ===== EVENTS ===== */
let rec,chunks=[];
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-a]');if(!el||el.tagName==='SELECT'||el.tagName==='INPUT'&&el.type!=='checkbox')return;const a=el.dataset.a,v=el.dataset.v;
if(a==='nav')go(v);else if(a==='lv'){S.lv=v;S.pick=null;save();render()}else if(a==='cx'){S.cx=v;S.pick=null;render()}
else if(a==='pick'){if(+v===-1)S.pick=null;else if(S.pick===null){S.pick=+v;if(S.pick===lesson()[4]){S.ld[lk()]=1;S.done.english=true;save()}}render()}
else if(a==='say'){if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(v);u.lang='en-US';u.rate=el.dataset.slow?.6:.9;speechSynthesis.speak(u)}else toast('Audio is not supported in this browser.')}
else if(a==='save'){S.saved[v]=!S.saved[v];save();render()}else if(a==='compose'){S.compose=!S.compose;S.err='';render()}
else if(a==='report'){S.rep[v]=1;toast('Demo only: in a real launch this would flag the post for a moderator to review.')}
else if(a==='out'){S.name='';S.compose=false;toast('Signed out of the demo profile.')}else if(a==='x'){S.toast='';render()}
else if(a==='big'){S.big=!S.big;render()}
else if(a==='rec'){if(rec&&rec.state==='recording'){rec.stop();return}if(!navigator.mediaDevices||!window.MediaRecorder)return toast('Recording is not supported in this browser.');navigator.mediaDevices.getUserMedia({audio:true}).then(m=>{rec=new MediaRecorder(m);chunks=[];rec.ondataavailable=x=>chunks.push(x.data);rec.onstop=()=>{m.getTracks().forEach(k=>k.stop());S.clip=URL.createObjectURL(new Blob(chunks));render()};rec.start();el.textContent='■ Stop recording'}).catch(()=>toast('Microphone unavailable or permission denied.'))}});
document.addEventListener('change',ev=>{const el=ev.target,a=el.dataset.a;if(!a)return;
if(a==='chk'){S.done[el.dataset.v]=el.checked;save();render()}else if(a==='L'){S.lang=el.value;save();render()}else if(a==='cult'){S.cult=el.value;render()}
else if(a==='fl'){S.fl=el.value;$('#fl-list').innerHTML=fitems()}else if(a==='ft'){S.ft=el.value;$('#fl-list').innerHTML=fitems()}});
document.addEventListener('input',ev=>{if(ev.target.dataset.a==='q'){S.q=ev.target.value;$('#fl-list').innerHTML=fitems()}});
const PII=/\b[aA][-\s]?\d{8,9}\b|\b\d{3}-\d{2}-\d{4}\b|[\w.+-]+@[\w-]+\.\w+|\b\d{3}[-.\s]\d{3}[-.\s]\d{4}\b|passport|alien registration|receipt number|case number/i;
document.addEventListener('submit',ev=>{const f=ev.target.dataset.f;if(!f)return;ev.preventDefault();const d=Object.fromEntries(new FormData(ev.target));
if(f==='county'){S.county=(d.county||'').trim().slice(0,80);save();toast(S.county?'Area set to '+S.county:'Area cleared.')}
else if(f==='cloc'){S.county=(d.county||'').trim().slice(0,80);S.cult=d.cult;S.done.community=true;save();toast('Search updated.')}
else if(f==='acct'){const n=(d.name||'').trim();if(n.length<2||PII.test(n)){return toast('Please enter a nickname (2+ characters, no personal identifiers).')}S.name=n.slice(0,30);S.pref=d.pref;S.county=(d.county||'').trim().slice(0,80);S.lv=d.lv;save();toast('Demo profile saved for this session only.')}
else if(f==='post'){const h=(d.h||'').trim(),b=(d.b||'').trim();if(h.length<5||b.length<10){S.err='Please add a title (5+ characters) and a post (10+ characters).';return render()}
if(PII.test(h+' '+b)){S.err='This looks like it may include private information (such as an email, phone, ID or case number). Please remove it and post again.';return render()}
S.posts.unshift({a:S.name,l:d.l,t:d.t,h,b,my:1});S.compose=false;S.err='';toast('Posted to this demo session only.')}});
const done=()=>{if(S.page==='imm'&&S.done)0};
render();
})();
</script></body></html>
